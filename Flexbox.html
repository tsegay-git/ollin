<!DOCTYPE html>
<html>
    <head>
        <title>" flexbox</title>
        <style> 
            #container {
                display: flex;
                flex-wrap: wrap;
                 border: 2px solid blueviolet;
                 margin: 40px;
            }
            #container > div {
                background-color: grey(211, 211, 211, 0.497);
                border: 1px solid black;
                margin: 20px;
                padding: 20px;
                font-size: 20px
                width: 200px;
            }

        </style>
    </head>
    <body>
        <div id="container">
            <div>1. this is sample flexbox</div>
            <div>2. this is sample flexbox</div>
            <div> 3.this is sample flexbox</div>
            <div> 4. this is sample flexbox</div>
            <div> 5. this is sample flexbox</div>
            <div> 6. this is sample flexbox</div>

        </div>
        
    </body>
</html>
